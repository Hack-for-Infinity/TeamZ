<!DOCTYPE html>
<html>
<head>
<title>AI Reader</title>

<style>

body{
width:320px;
font-family:Arial;
background:#f4f6f8;
padding:15px;
}

h3{
text-align:center;
}

button{
width:100%;
padding:10px;
margin-top:8px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#45a049;
}

#result{
margin-top:12px;
background:white;
padding:10px;
border-radius:5px;
max-height:200px;
overflow-y:auto;
}
#mindmapContainer{
height:300px;
background:#111;
margin-top:10px;
border-radius:6px;
}

#mindmapSVG{
width:100%;
height:100%;
}

.node{
fill:#00e5ff;
cursor:pointer;
}

.label{
fill:white;
font-size:12px;
}

</style>
</head>

<body>

<h3>AI Reading Assistant</h3>

<button id="summary">Summarize Page</button>
<button id="focus">Focus Mode</button>
<button id="bionic">Bionic Reading</button>
<button id="highlight">Line Highlighter</button>
<button id="sentenceread">Sentence Reader</button>
<button id="clean">Remove Distractions</button>
<button id="tts">Read Aloud</button>
<button id="stoptts">Stop Reading</button>
<button id="highlightDigits">Highlight Digits</button>
<button id="reset">Reset Page</button>

<div id="result"></div>

<script src="popup.js"></script>

</body>
</html>
